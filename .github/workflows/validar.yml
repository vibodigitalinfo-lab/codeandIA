name: Validar

# El build de Pages es el de GitHub por defecto (no hay workflow de build aqui,
# a proposito: anadirlo podria romper el despliegue). Este workflow solo
# comprueba lo que se puede comprobar sin Jekyll: fechas, ficha de las reviews
# y que el YAML siga parseando.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # fechas_check.py, auditar_reviews.py y el paso de _config.yml usan
      # PyYAML. El runner no lo trae de serie.
      - name: Instalar dependencias
        run: pip install --quiet pyyaml

      - name: Fechas sin repetir ni futuras
        run: python fechas_check.py

      - name: Fechas de revision coherentes
        run: python scripts/marcar_actualizado.py --check

      # La promesa de /como-trabajamos/ ("cada review abre con una ficha de
      # prueba") no la hacia cumplir nadie: un review nuevo sin ficha se
      # publicaba igual. Aqui falla la build si vuelve a pasar.
      - name: Ficha de prueba completa en las reviews
        run: python scripts/auditar_reviews.py

      - name: El YAML de _config.yml parsea
        run: |
          python - <<'PY'
          import sys, yaml
          try:
              yaml.safe_load(open('_config.yml', encoding='utf-8'))
          except Exception as e:
              # Un YAML roto tira la build de Pages de forma opaca
              # ("did not find expected key while parsing"), asi que aqui se
              # ve el error de verdad.
              print('YAML invalido en _config.yml: %s' % e)
              sys.exit(1)
          print('_config.yml parsea')
          PY

      # El log de Pages esta capado a 4096 caracteres y el error real sale al
      # final, asi que un fallo de Liquid se lee como "Build with Jekyll
      # failed" sin mas. Esta comprobacion adelanta los dos fallos que ya han
      # roto la build: un assign con comillas desbalanceadas (Liquid ve el "
      # como cierre de cadena) y un frontmatter que no parsea.
      #
      # feed.xml se deja fuera a proposito: sus assigns construyen HTML de
      # las entradas y traen comillas legitimas.
      - name: Liquid y frontmatter saneables
        run: |
          python - <<'PY'
          import io, os, re, sys, yaml

          fallos = []

          for raiz, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs
                         if d not in ('.git', '_site', 'node_modules')]
              for f in files:
                  if not f.endswith(('.html', '.md')):
                      continue
                  rel = os.path.join(raiz, f).replace('\\', '/')
                  if rel.startswith(('./AGENTS', './README', './PROMPT')):
                      continue
                  texto = io.open(rel, encoding='utf-8',
                                  errors='replace').read()

                  m = re.match(r'^---\r?\n(.*?)\r?\n---', texto, re.S)
                  if m:
                      try:
                          yaml.safe_load(m.group(1))
                      except Exception as e:
                          fallos.append('%s: frontmatter invalido: %s'
                                        % (rel, str(e).split('\n')[0]))

                  for i, linea in enumerate(texto.splitlines(), 1):
                      a = re.search(
                          r'\{%-?\s*assign\s+(\w+)\s*=\s*(.*?)\s*-?%\}',
                          linea)
                      if not a:
                          continue
                      valor = a.group(2)
                      # where_exp/where legitimos traen comillas internas,
                      # pero un string plano con un " de mas es el fallo
                      # que tiro la build el 2026-10-01.
                      if valor.count('"') > 2 and '|' in valor \
                              and '.md' in valor:
                          fallos.append('%s:%d assign con comillas raras: %s'
                                        % (rel, i, valor[:70]))
                      if valor.count('"') % 2:
                          fallos.append('%s:%d comillas sin cerrar: %s'
                                        % (rel, i, valor[:70]))

          for f in fallos:
              print('FALLO %s' % f)
          if fallos:
              sys.exit(1)
          print('Liquid y frontmatter correctos')
          PY