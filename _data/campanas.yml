# Campañas de temporada que se anuncian en /ofertas/.
#
# Cada entrada corresponde a una página que vive en articulos/_entrada/ hasta
# su fecha. El enlace de la tarjeta se activa solo cuando hoy ya es esa fecha
# o posterior; antes se muestra como texto plano. Ver AGENTS.md, sección
# "Campañas con fecha".
#
# OJO con las URLs: los dos `article` no llevan `permalink` en su frontmatter,
# así que su URL la decide la ruta del fichero al publicarlos. Si mueves
# articulos/_entrada/<slug>/borrador.md a una carpeta que no sea
# articulos/listas/, hay que corregir aquí la url o ese enlace dara 404.

