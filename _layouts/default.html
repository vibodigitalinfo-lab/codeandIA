<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relative_url }}">
  <link rel="apple-touch-icon" href="{{ "/apple-touch-icon.png" | relative_url }}">

  <meta name="author" content="Iván">
  {% if page.noindex %}
  <meta name="robots" content="noindex,follow">
  {% else %}
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">
  {% endif %}

  <!-- Open Graph (previstas al compartir en redes) -->
  <meta property="og:type" content="{% if page.category %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ "/og-image.png" | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="codeandIA: blog personal de un estudiante de DAW">
  {% if page.category %}
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
{% if page.last_modified_at or page.updated %}
<meta property="article:modified_time" content="{{ page.last_modified_at | default: page.updated | date_to_xmlschema }}">
{% endif %}
  <meta property="article:section" content="{{ page.category }}">
  {% endif %}

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta name="twitter:image" content="{{ "/og-image.png" | absolute_url }}">
  <meta name="twitter:image:alt" content="codeandIA: blog personal de un estudiante de DAW">

  <!-- Canonical (evita contenido duplicado en buscadores) -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | absolute_url }}">

  <!-- Color de tema en móviles (lo ajusta el script del tema antes de pintar) -->
  <meta name="theme-color" content="#fbfcfe">

  <!-- Fuentes propias: precarga la de texto, la de títulos se pide bajo demanda -->
  <link rel="preload" href="{{ "/assets/fonts/atkinson-hyperlegible-400-latin.woff2" | relative_url }}" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="{{ "/styles.css" | relative_url }}">

  <!-- Tema: aplica la preferencia antes de pintar (evita parpadeo) -->
  <script>
    (function () {
      var theme = 'light';
      try {
        var saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          theme = saved;
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
          theme = 'dark';
        }
      } catch (e) {}
      if (theme === 'dark') {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
      var mt = document.querySelector('meta[name="theme-color"]');
      if (mt) mt.setAttribute('content', theme === 'dark' ? '#0f1320' : '#fbfcfe');
    })();
  </script>

  <script src="{{ "/assets/site.js" | relative_url }}" defer></script>

  <!-- Datos estructurados: sitio + organización + autor -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebSite",
        "@id": {{ site.url | append: "/" | jsonify }},
        "name": {{ site.title | jsonify }},
        "url": {{ site.url | append: "/" | jsonify }},
        "description": {{ site.description | jsonify }},
        "inLanguage": "es-ES",
        "publisher": { "@id": {{ site.url | append: "/#organization" | jsonify }} }
      },
      {
        "@type": "Organization",
        "@id": {{ site.url | append: "/#organization" | jsonify }},
        "name": {{ site.title | jsonify }},
        "url": {{ site.url | append: "/" | jsonify }},
        "description": {{ site.description | jsonify }},
        "logo": {
          "@type": "ImageObject",
          "url": {{ "/apple-touch-icon.png" | absolute_url | jsonify }}
        },
        "founder": { "@id": {{ site.url | append: "/#ivan" | jsonify }} }
      },
      {
        "@type": "Person",
        "@id": {{ site.url | append: "/#ivan" | jsonify }},
        "name": "Iván",
        "jobTitle": "Estudiante de Desarrollo de Aplicaciones Web",
        "description": "Autor de codeandIA: lo que pruebo y lo que me pasa como estudiante de DAW.",
        "url": {{ site.url | append: "/sobre-mi/" | jsonify }},
        "email": "ivan@codeandia.com"
      }
    ]
  }
  </script>
</head>
<body>

  <a class="skip-link" href="#main">Saltar al contenido</a>

  {% include nav.html %}

  <main id="main">
    {{ content }}
  </main>

  {% include footer.html %}

</body>
</html>
