<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} — {{ site.description }}{% endif %}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="{{ "/favicon.svg" | relative_url }}">

  <!-- Open Graph (previstas al compartir en redes) -->
  <meta property="og:type" content="{% if page.category %}article{% else %}website{% endif %}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ "/favicon.svg" | absolute_url }}">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- Canonical (evita contenido duplicado en buscadores) -->
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <!-- RSS -->
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | absolute_url }}">

  <!-- Color de tema en móviles -->
  <meta name="theme-color" content="#0d0d0f">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ "/styles.css" | relative_url }}">

  <!-- Tema: aplica la preferencia guardada antes de pintar (evita parpadeo) -->
  <script>
    (function () {
      try {
        if (localStorage.getItem('theme') === 'light') {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Idioma: fija la cookie que entiende el widget de Google Translate antes de que cargue (evita parpadeo/idioma incorrecto) -->
  <script>
    (function () {
      var lang = 'es';
      try {
        var saved = localStorage.getItem('lang');
        if (saved === 'en' || saved === 'es') lang = saved;
        else localStorage.setItem('lang', lang);
      } catch (e) {}
      document.cookie = 'googtrans=/es/' + lang + '; path=/; max-age=31536000; SameSite=Lax';
      if (lang === 'en') document.documentElement.lang = 'en';
    })();
  </script>

  <!-- Oculta de raíz TODA la UI que Google Translate intenta inyectar (inline,
       no cacheado, se aplica ANTES de que element.js se cargue) -->
  <style>
    .goog-te-banner-frame,
    .goog-te-banner,
    .goog-te-banner-bottom,
    .goog-te-balloon-frame,
    .goog-te-menu-frame,
    .goog-te-menu,
    .goog-te-menu2,
    .goog-te-menu2-frame,
    .goog-te-combo,
    .goog-te-gadget,
    .goog-te-gadget-simple,
    #goog-gt-tt,
    .goog-te-spinner-pos,
    .goog-te-spinner,
    #goog-te-scroll-animation,
    .goog-te-spinner-pos,
    [id^="goog-"],
    [class^="goog-te-"],
    [class*="goog-te-"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      max-height: 0 !important;
      overflow: hidden !important;
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
    }
    #google_translate_element {
      position: absolute !important;
      left: -9999px !important;
      top: -9999px !important;
      width: 0 !important;
      height: 0 !important;
      overflow: hidden !important;
      pointer-events: none !important;
    }
    html > .goog-te-banner-frame { display: none !important; }
    html > div > div > iframe.goog-te-banner-frame { display: none !important; }
    body { top: 0 !important; }
  </style>
</head>
<body>

  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

  <script>
    /* Menú de navegación móvil */
    (function () {
      var toggle = document.querySelector('.nav-toggle');
      var menu = document.getElementById('nav-menu');
      if (!toggle || !menu) return;

      function close() {
        menu.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
      }

      toggle.addEventListener('click', function () {
        var open = !menu.classList.contains('open');
        menu.classList.toggle('open', open);
        toggle.classList.toggle('open', open);
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });

      // Cierra el menú al pulsar cualquier enlace
      menu.addEventListener('click', function (e) {
        if (e.target.tagName === 'A') close();
      });

      // Cierra con la tecla Escape
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') close();
      });
    })();

    /* Filtro de artículos por categoría + paginación en la portada */
    (function () {
      var tabs = document.querySelectorAll('.filter-tab');
      var cards = document.querySelectorAll('.article-card[data-category]');
      var paginationEl = document.getElementById('pagination');
      var gridEl = document.getElementById('articles-grid');
      if (!tabs.length || !cards.length) return;

      var PER_PAGE = 6;
      var currentPage = 1;
      var activeFilter = 'all';

      function getFilteredCards() {
        return Array.prototype.filter.call(cards, function (card) {
          return activeFilter === 'all' || card.getAttribute('data-category') === activeFilter;
        });
      }

      function totalPages() {
        return Math.max(1, Math.ceil(getFilteredCards().length / PER_PAGE));
      }

      function renderPage() {
        var filtered = getFilteredCards();
        var start = (currentPage - 1) * PER_PAGE;
        var end = start + PER_PAGE;

        Array.prototype.forEach.call(cards, function (card) {
          card.style.display = 'none';
        });

        filtered.forEach(function (card, i) {
          card.style.display = (i >= start && i < end) ? '' : 'none';
        });

        renderPagination();
      }

      function renderPagination() {
        var filtered = getFilteredCards();
        var total = totalPages();
        if (!paginationEl) return;

        if (filtered.length <= PER_PAGE) {
          paginationEl.innerHTML = '';
          return;
        }

        var html = '';
        html += '<button class="pagination-btn pagination-prev" data-action="prev"' +
          (currentPage <= 1 ? ' disabled' : '') + ' aria-label="Página anterior">← Anterior</button>';
        html += '<span class="pagination-info">Página ' + currentPage + ' de ' + total + '</span>';
        html += '<button class="pagination-btn pagination-next" data-action="next"' +
          (currentPage >= total ? ' disabled' : '') + ' aria-label="Página siguiente">Siguiente →</button>';
        paginationEl.innerHTML = html;
      }

      function scrollToGrid() {
        if (gridEl) {
          gridEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }

      paginationEl.addEventListener('click', function (e) {
        var btn = e.target.closest('[data-action]');
        if (!btn) return;
        var action = btn.getAttribute('data-action');
        if (action === 'prev' && currentPage > 1) {
          currentPage--;
          renderPage();
          scrollToGrid();
        } else if (action === 'next' && currentPage < totalPages()) {
          currentPage++;
          renderPage();
          scrollToGrid();
        }
      });

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          activeFilter = tab.getAttribute('data-filter');
          currentPage = 1;
          tabs.forEach(function (t) { t.classList.remove('is-active'); });
          tab.classList.add('is-active');
          renderPage();
        });
      });

      renderPage();
    })();

    /* Selector de idioma ES/EN (recuerda la preferencia en localStorage y
       la sincroniza con la cookie googtrans que entiende el widget de Google Translate) */
    (function () {
      var switcher = document.querySelector('.lang-switch');
      if (!switcher) return;

      var current = 'es';
      try {
        var saved = localStorage.getItem('lang');
        if (saved === 'en' || saved === 'es') current = saved;
      } catch (e) {}

      function render() {
        switcher.querySelectorAll('.lang-btn').forEach(function (btn) {
          var active = btn.getAttribute('data-lang') === current;
          btn.classList.toggle('is-active', active);
          btn.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function setLang(lang) {
        try {
          localStorage.setItem('lang', lang);
        } catch (e) {}
        document.cookie = 'googtrans=/es/' + lang + '; path=/; max-age=31536000; SameSite=Lax';
      }

      switcher.addEventListener('click', function (e) {
        var btn = e.target.closest('.lang-btn');
        if (!btn) return;
        var lang = btn.getAttribute('data-lang');
        if (lang === current) return;
        setLang(lang);
        window.location.reload();
      });

      render();
    })();

    /* Mata cualquier fragmento de UI que inyecte el widget de Google Translate
       (banner superior, tooltip al pasar el ratón, desplegables flotantes).
       El único control de idioma visible es el botón ES/EN de la navegación. */
    (function () {
      function isGoogleTranslate(el) {
        if (el.nodeType !== 1) return false;
        var id = (el.id || '').toLowerCase();
        var cls = (el.className && typeof el.className === 'string')
          ? el.className.toLowerCase() : '';
        var tag = el.tagName ? el.tagName.toLowerCase() : '';
        if (id.indexOf('goog') !== -1 || cls.indexOf('goog') !== -1) return true;
        if (tag === 'iframe' && cls.indexOf('goog') !== -1) return true;
        return false;
      }

      function purge() {
        if (!document.body) return;
        /* Elimina hijos directos de html y body que sean de Google */
        var containers = [document.documentElement, document.body];
        for (var c = 0; c < containers.length; c++) {
          var kids = containers[c].children;
          for (var i = kids.length - 1; i >= 0; i--) {
            if (isGoogleTranslate(kids[i])) {
              kids[i].parentNode.removeChild(kids[i]);
            }
          }
        }
        /* Busca y elimina iframes de Google en cualquier parte del DOM */
        var iframes = document.querySelectorAll('iframe');
        for (var j = 0; j < iframes.length; j++) {
          if (isGoogleTranslate(iframes[j])) {
            iframes[j].parentNode && iframes[j].parentNode.removeChild(iframes[j]);
          }
        }
        /* Restaura el desplazamiento de body que Google modifica */
        document.body.style.top = '0px';
        document.body.style.minHeight = '0px';
        document.documentElement.style.top = '0px';
      }

      if (window.MutationObserver) {
        purge();
        /* Observa TODO el document con subtree:true para atrapar nodos
           inyectados en cualquier profundidad del DOM */
        var observer = new MutationObserver(function (mutations) {
          for (var m = 0; m < mutations.length; m++) {
            var added = mutations[m].addedNodes;
            for (var n = 0; n < added.length; n++) {
              var node = added[n];
              if (isGoogleTranslate(node)) {
                node.parentNode && node.parentNode.removeChild(node);
              } else if (node.nodeType === 1 && node.querySelectorAll) {
                /* Si el nodo añadido contiene hijos de Google, bórralos */
                var gElems = node.querySelectorAll('[id*="goog"], [class*="goog"], iframe');
                for (var g = 0; g < gElems.length; g++) {
                  gElems[g].parentNode && gElems[g].parentNode.removeChild(gElems[g]);
                }
              }
            }
          }
          if (document.body) {
            document.body.style.top = '0px';
            document.body.style.minHeight = '0px';
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });
      }

      /* Fallback: revisión periódica los primeros 30s por si Google inyecta
         elementos de forma asíncrona (timer, lazy load, etc.) */
      var cleanupCount = 0;
      var cleanupInterval = setInterval(function () {
        purge();
        cleanupCount++;
        if (cleanupCount >= 30) clearInterval(cleanupInterval);
      }, 1000);

      /* También al cargar completamente el DOM */
      if (document.readyState === 'complete') {
        purge();
      } else {
        window.addEventListener('load', purge);
      }
    })();

    /* Toggle de tema claro/oscuro (recuerda la preferencia en localStorage) */
    (function () {
      var toggle = document.getElementById('theme-toggle');
      if (!toggle) return;

      var metaTheme = document.querySelector('meta[name="theme-color"]');
      var LIGHT_BG = '#fafafc';
      var DARK_BG = '#0d0d0f';

      function isLight() {
        return document.documentElement.getAttribute('data-theme') === 'light';
      }

      function applyTheme(light) {
        if (light) {
          document.documentElement.setAttribute('data-theme', 'light');
        } else {
          document.documentElement.removeAttribute('data-theme');
        }
        if (metaTheme) {
          metaTheme.setAttribute('content', light ? LIGHT_BG : DARK_BG);
        }
        var label = light ? 'Cambiar a modo oscuro' : 'Cambiar a modo claro';
        toggle.setAttribute('aria-label', label);
        toggle.setAttribute('title', label);
      }

      toggle.addEventListener('click', function () {
        var next = !isLight();
        applyTheme(next);
        try {
          localStorage.setItem('theme', next ? 'light' : 'dark');
        } catch (e) {}
      });

      // Sincroniza el estado inicial (aria-label y color de tema del móvil)
      var saved = null;
      try { saved = localStorage.getItem('theme'); } catch (e) {}
      applyTheme(isLight() || saved === 'light');
    })();
  </script>

  <!-- Skimlinks: conversión automática de enlaces de afiliado -->
  <script type="text/javascript" src="https://s.skimresources.com/js/309068X1797398.skimlinks.js"></script>

  <!-- Widget de Google Translate (oculto): traduce todo el contenido ES<->EN sin API key.
       Los botones de la navegación fijan la cookie googtrans y recargan para aplicar la traducción. -->
  <div id="google_translate_element" aria-hidden="true"></div>
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'es',
        includedLanguages: 'es,en',
        autoDisplay: false
      }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
