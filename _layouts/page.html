---
layout: default
---

<article class="article">
  <div class="container">
    <div class="article-header">
      <h1 class="article-title">{{ page.title }}</h1>
      {% if page.updated %}
      <div class="article-meta">Última actualización: {{ page.updated | date: "%d/%m/%Y" }}</div>
      {% endif %}
    </div>

    <div class="article-content">
      {{ content }}
    </div>

    <a href="{{ "/" | relative_url }}" class="back-link">← Volver a la portada</a>
  </div>
</article>
