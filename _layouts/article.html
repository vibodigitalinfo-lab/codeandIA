---
layout: default
---
<article class="article">

  <header class="article-header">
    <span class="pill">{{ page.category }}</span>
    <h1 class="article-title">{{ page.title }}</h1>
    <div class="article-meta">
      <span>{{ page.date | date: "%d/%m/%Y" }}</span>
      <span class="meta-dot">·</span>
      <span>{{ page.readtime }} min de lectura</span>
    </div>
  </header>

  <div class="article-content">
    {{ content }}
  </div>

  {% if page.affiliate_url %}
  <div class="affiliate-box">
    <p>{{ page.affiliate_text }}</p>
    <a href="{{ page.affiliate_url }}" class="btn btn-accent" target="_blank" rel="nofollow sponsored noopener">
      {{ page.affiliate_label }}
    </a>
  </div>
  {% endif %}

  <a href="{{ "/" | relative_url }}#articulos" class="back-link">Volver a artículos</a>

</article>
