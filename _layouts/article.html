---
layout: default
---

<article class="article">
  <div class="container">
    <div class="article-header">
      {% if page.category %}
      <span class="pill">{{ page.category }}</span>
      {% endif %}
      <h1 class="article-title">{{ page.title }}</h1>
      <div class="article-meta">
        <span>{{ page.date | date: "%d/%m/%Y" }}</span>
        {% if page.read_time %}<span class="meta-dot">·</span><span>{{ page.read_time }}</span>{% endif %}
      </div>
    </div>

    <div class="article-content">
      {{ content }}
    </div>

    <a href="{{ "/" | relative_url }}" class="back-link">← Volver a artículos</a>
  </div>
</article>
