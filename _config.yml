title: codeandIA
description: "Blog personal de un estudiante de DAW: lo que pruebo y lo que me pasa."
url: "https://codeandia.com"
baseurl: ""
markdown: kramdown
permalink: /articulos/:slug/

# Newsletter (beehiiv).
#   subscribe_url -> página de suscripción de la publicación. El sitio solo
#                    enlaza hacia ella (antes llevaba el embed v3, que
#                    cargaba un script de terceros de ~120 KB por artículo
#                    y hundía el rendimiento; se quitó el 2026-10-18).
#                    El envío de la newsletter sigue gestionándose en beehiiv.
newsletter:
  subscribe_url: "https://newsletter.codeandia.com/subscribe"

# Autor del blog. Se usa en la caja de autor, en "Sobre mí" y en los datos
# estructurados (Person). Rellenar solo con perfiles reales del autor.
#   same_as -> URLs de perfiles públicos (GitHub, LinkedIn...). Salen como
#              enlaces visibles y como "sameAs" para que Google pueda
#              comprobar quién escribe.
#   foto    -> ruta a una foto real (p. ej. /assets/img/ivan.jpg). Vacío = sin foto.
author:
  name: "Vibo"
  job_title: "Estudiante de Desarrollo de Aplicaciones Web"
  email: "ivan@codeandia.com"
  foto: ""
  same_as:
    - "https://github.com/vibodigitalinfo-lab"

# Plugin de sitemap automático (permitido por GitHub Pages)
plugins:
  - jekyll-sitemap

# Cada .md dentro de /articulos/<categoria>/ (guias, reviews, comparativas, listas)
# sale publicado con su layout de artículo y la URL real que genera Jekyll
# para páginas en subcarpeta: /articulos/<categoria>/<nombre-del-articulo>/
defaults:
  - scope:
      path: "articulos/"   # con "/" final para que aplique a las subcarpetas (reviews/, comparativas/, guias/, listas/)
    values:
      layout: article

exclude:
  - README.md
  - PROMPT.md
  - AGENTS.md
  - prompts   # templates internos del pipeline; no deben publicarse como páginas
  - scripts   # scripts internos, no son contenido del sitio
  - curso     # app del curso (Next.js/Stripe/Supabase): NO debe publicarse con el blog
  - finanzas   # datos financieros personales: nunca en el sitio
  - plan-ingresos-y-gestoria.md   # plan de negocio interno: nunca en el sitio
  - experiences
  - fix_dates.py
  - "*.py"
