<!-- newsletter form — beehiiv publication pub_bde739e1 -->
<div class="newsletter-box" id="nl-box">
  <h3 class="newsletter-title">Una vez a la semana, sin ruido</h3>
  <p class="newsletter-subtitle">Lo que de verdad me funciona programando con IA, resumido y sin relleno. Cancelas en un clic.</p>
  <form action="https://api.beehiiv.com/v2/publications/pub_bde739e1-87d5-4bb5-8c03-83ecd8e1bff7/subscriptions" method="POST" class="newsletter-form" id="nl-form">
    <label for="nl-email" class="visually-hidden">Email</label>
    <input type="email" id="nl-email" name="email" placeholder="tu@email.com" required>
    <button type="submit" class="nl-btn">Suscribirme gratis</button>
  </form>
  <p class="nl-note">1 email/semana · Sin spam · Cancela cuando quieras. Al suscribirte aceptas la <a href="{{ "/privacidad/" | relative_url }}">política de privacidad</a>.</p>
</div>

<script>
document.getElementById('nl-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const form = e.target;
  const btn = form.querySelector('button');
  const email = form.email.value;
  btn.disabled = true; btn.textContent = 'Suscribiendo...';
  try {
    const res = await fetch(form.action, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({ email, reactivate_existing: true, send_welcome_email: true })
    });
    if (res.ok) {
      document.getElementById('nl-box').innerHTML =
        '<p class="nl-success" style="font-weight:600;padding:1.5rem 0;">Dentro. Revisa tu bandeja (y el spam) para confirmar.</p>';
    } else { throw new Error(); }
  } catch {
    btn.disabled = false; btn.textContent = 'Suscribirme gratis';
    alert('Algo falló. Inténtalo de nuevo.');
  }
});
</script>
